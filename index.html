<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen Reader · Tu lectura con inteligencia</title>
<meta name="description" content="Lumen Reader: app de lectura con IA local, mascota Lumo, vocabulario y gamificación. Todo en tu dispositivo, sin servidores.">
<style>
  /* ============================================================
     LUMEN READER · Landing page (estilo de lectura)
     Edita SOLO el bloque CONFIG en el <script> de abajo.
     Todo lo demás se adapta automáticamente.
     ============================================================ */
  :root{
    --bg:#f7f4ee;
    --bg-2:#ffffff;
    --ink:#23242e;
    --muted:#6a6f7c;
    --accent:#6c4bd4;
    --accent-2:#ff9f0a;
    --accent-grad:linear-gradient(135deg,#6c4bd4 0%,#9a5cf0 100%);
    --card:#ffffff;
    --line:#e8e3d8;
    --radius:20px;
    --shadow:0 12px 34px rgba(30,30,40,.10);
    --serif:'Georgia','Iowan Old Style','Palatino',serif;
    --font:'Inter','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --shadow-soft:0 4px 14px rgba(30,30,40,.06);
  }
  /* ---- Modo oscuro ---- */
  [data-theme="dark"]{
    --bg:#14141b;
    --bg-2:#1c1d26;
    --ink:#eef0f6;
    --muted:#a6abbb;
    --card:#22232f;
    --line:#33343f;
    --shadow:0 14px 36px rgba(0,0,0,.45);
    --shadow-soft:0 4px 14px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}

  /* ---------- Header / nav ---------- */
  header{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:66px;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-family:var(--serif);font-weight:700;font-size:1.18rem;letter-spacing:.2px}
  .logo{width:36px;height:36px;border-radius:10px;background:var(--accent-grad);display:grid;place-items:center;color:#fff;font-size:1.15rem;box-shadow:var(--shadow-soft)}
  .nav-actions{display:flex;align-items:center;gap:8px}
  .nav-links{display:flex;gap:22px;align-items:center}
  .nav-links a{color:var(--ink);font-weight:600;font-size:.95rem;opacity:.85}
  .nav-links a:hover{opacity:1;color:var(--accent)}
  .icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:1.05rem;transition:.15s}
  .icon-btn:hover{border-color:var(--accent)}
  .btn-dl-sm{background:var(--accent-grad);color:#fff!important;opacity:1!important;padding:9px 18px;border-radius:999px;font-weight:700;box-shadow:var(--shadow-soft)}
  .btn-dl-sm:hover{transform:translateY(-1px)}

  /* ---------- Hero ---------- */
  .hero{position:relative;padding:78px 0 64px;overflow:hidden}
  .hero .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0}
  .blob.b1{width:360px;height:360px;background:#c9b7ff;top:-90px;right:-70px}
  .blob.b2{width:320px;height:320px;background:#ffe3a3;bottom:-100px;left:-60px}
  [data-theme="dark"] .blob{opacity:.25}
  .hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr .9fr;gap:50px;align-items:center}
  .badge{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:7px 15px;border-radius:999px;font-size:.8rem;font-weight:600;color:var(--accent);margin-bottom:22px;box-shadow:var(--shadow-soft)}
  .badge .dot{width:8px;height:8px;border-radius:50%;background:#2ecc71}
  h1{font-family:var(--serif);font-size:clamp(2rem,4.8vw,3.4rem);line-height:1.12;letter-spacing:-.5px;margin-bottom:20px;font-weight:700}
  h1 .grad{background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:1.1rem;color:var(--muted);max-width:520px;margin-bottom:30px}
  .cta-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .btn-dl{display:inline-flex;align-items:center;gap:12px;background:var(--accent-grad);color:#fff;font-weight:800;font-size:1.08rem;padding:17px 32px;border-radius:999px;box-shadow:0 14px 34px rgba(108,75,212,.38);transition:transform .15s,box-shadow .15s;cursor:pointer;border:none}
  .btn-dl:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(108,75,212,.5)}
  .btn-dl .dl-ic{width:22px;height:22px}
  .btn-sec{display:inline-flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:700;padding:16px 24px;border-radius:999px;box-shadow:var(--shadow-soft);transition:.15s}
  .btn-sec:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .btn-sec.premium{background:linear-gradient(135deg,#ffb400,#ff8a00);color:#fff;border:none;box-shadow:0 10px 26px rgba(255,164,0,.32)}
  .btn-sec.premium:hover{color:#fff;transform:translateY(-2px);box-shadow:0 14px 32px rgba(255,164,0,.42)}
  .meta-line{display:flex;flex-wrap:wrap;gap:16px;margin-top:26px;color:var(--muted);font-size:.9rem;font-weight:600}
  .meta-line span{display:inline-flex;align-items:center;gap:6px}
  .meta-line .chk{color:#2ecc71;font-weight:800}
  .phone-wrap{position:relative;z-index:1}
  .phone{aspect-ratio:9/19;max-width:340px;margin:0 auto;border-radius:40px;background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--card) 70%,#ece7f7));border:10px solid var(--ink);box-shadow:0 30px 60px rgba(30,30,40,.28);overflow:hidden;padding:14px;display:flex;flex-direction:column;gap:12px}
  .ph-bar{height:6px;width:90px;background:#e3def5;border-radius:99px;margin:2px auto 8px}
  .ph-tile{border-radius:14px;background:#f0edf9;height:54px}
  .ph-tile.wide{height:118px;background:var(--accent-grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.2rem}
  .ph-rows{display:flex;flex-direction:column;gap:8px;flex:1}
  .ph-rows .r{height:14px;border-radius:6px;background:var(--line)}
  .ph-rows .r.w50{width:50%}
  .ph-rows .r.w75{width:75%}
  .ph-chips{display:flex;gap:8px;flex-wrap:wrap}
  .ph-chips span{background:color-mix(in srgb,var(--accent-2) 22%,transparent);color:var(--accent-2);font-size:.62rem;font-weight:800;padding:5px 9px;border-radius:99px}

  /* ---------- Secciones ---------- */
  section{padding:66px 0}
  .sec-tag{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:1.4px;font-size:.76rem;margin-bottom:12px}
  h2{font-family:var(--serif);font-size:clamp(1.7rem,3.2vw,2.4rem);letter-spacing:-.3px;margin-bottom:16px;font-weight:700}
  .lead{color:var(--muted);max-width:660px;margin-bottom:36px;font-size:1.06rem}

  /* Feature cards */
  .features{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .fcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow-soft);transition:transform .15s,box-shadow .15s}
  .fcard:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
  .fcard .ic{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;margin-bottom:18px;color:#fff;font-size:1.4rem;background:var(--accent-grad);box-shadow:var(--shadow-soft)}
  .fcard h3{font-family:var(--serif);font-size:1.1rem;margin-bottom:8px}
  .fcard p{color:var(--muted);font-size:.95rem}

  /* Screenshots */
  .shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:24px}
  .shot{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-soft);transition:transform .15s}
  .shot:hover{transform:translateY(-4px)}
  .shot .frame{aspect-ratio:9/19;background:var(--line);display:grid;place-items:center;position:relative;overflow:hidden}
  .shot .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .shot .cap{padding:14px 16px;font-family:var(--serif);font-size:.95rem;font-weight:600}
  .shot .cap small{display:block;color:var(--muted);font-family:var(--font);font-weight:500;margin-top:3px;font-size:.78rem}

  /* Download CTA */
  .dl-cta{background:var(--accent-grad);border-radius:28px;padding:56px 40px;color:#fff;text-align:center;position:relative;overflow:hidden}
  .dl-cta h2{color:#fff}
  .dl-cta .lead{color:rgba(255,255,255,.88)}
  .btn-dl.white{background:#fff;color:var(--accent);box-shadow:0 14px 34px rgba(0,0,0,.22)}
  .btn-dl.white:hover{box-shadow:0 18px 40px rgba(0,0,0,.3)}
  .dl-notes{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;margin-top:24px;font-size:.85rem;font-weight:600;color:rgba(255,255,255,.88)}
  .dl-notes span{display:inline-flex;align-items:center;gap:7px}

  /* Highlight (biblioteca sin dueño) */
  #highlight .wrap{position:relative}
  #highlight{position:relative;overflow:hidden}
  #highlight::before{content:"";position:absolute;inset:0;background:
    linear-gradient(135deg,color-mix(in srgb,var(--accent) 9%,transparent),
    color-mix(in srgb,var(--accent-2) 9%,transparent));pointer-events:none}
  #highlight .wrap{position:relative}
  #highlight .meta-line{max-width:900px}

  /* FAQ */
  .faq{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .qa{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 24px;box-shadow:var(--shadow-soft)}
  .qa h4{font-family:var(--serif);font-size:1.03rem;margin-bottom:6px}
  .qa p{color:var(--muted);font-size:.95rem}

  /* Footer */
  footer{border-top:1px solid var(--line);padding:36px 0 46px;text-align:center;color:var(--muted);font-size:.86rem}
  footer .brand{justify-content:center;margin-bottom:10px;color:var(--ink)}
  footer .brand .logo{width:30px;height:30px;font-size:.95rem}

  /* responsive */
  @media(max-width:860px){
    .hero-grid{grid-template-columns:1fr;gap:44px;text-align:center}
    .sub{margin-left:auto;margin-right:auto}
    .cta-row,.meta-line{justify-content:center}
    .nav-links{display:none}
    .features{grid-template-columns:1fr}
    .phone{max-width:300px}
    .dl-cta{padding:44px 24px}
  }
</style>
</head>

<script>
(function(){
  const C = CONFIG;
  const $ = id => document.getElementById(id);
  let lang = "es";

  // ---------- Detección / persistencia de idioma ----------
  function detectLang(){
    const saved = localStorage.getItem("lr_lang");
    if (saved) return saved;
    const nav = (navigator.language || navigator.userLanguage || "es").toLowerCase();
    return nav.startsWith("en") ? "en" : "es";
  }
  function setLang(l){
    lang = l; localStorage.setItem("lr_lang", l);
    applyLang();
  }

  // ---------- Tema claro / oscuro ----------
  function applyTheme(t){
    document.body.setAttribute("data-theme", t);
    localStorage.setItem("lr_theme", t);
    $("theme-toggle").textContent = t === "dark" ? "☀️" : "🌙";
  }
  function initTheme(){
    const saved = localStorage.getItem("lr_theme");
    const preferDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(saved || (preferDark ? "dark" : "light"));
  }
  $("theme-toggle").addEventListener("click", () => {
    const cur = document.body.getAttribute("data-theme");
    applyTheme(cur === "dark" ? "light" : "dark");
  });

  // ---------- Aplicar idioma ----------
  function applyLang(){
    const T = C[lang] || C.es;
    document.documentElement.lang = lang;
    // atributos data-i18n (salvo el copyright, que se arma abajo)
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (key === "foot_copyright") return;
      if (T[key] !== undefined) el.textContent = T[key];
    });
    $("nav-name").textContent = C.appName;
    $("foot-name").textContent = C.appName;
    $("nav-logo").textContent = C.logoEmoji;
    $("foot-logo").textContent = C.logoEmoji;

    // Hero
    $("hero-badge-text").textContent = T.badge;
    const ht = T.heroTitle;
    $("hero-title").innerHTML = ht.replace(/(\S+)\s*$/, '<span class="grad">$1</span>');
    $("hero-sub").textContent = T.heroSub;
    $("phone-title").textContent = T.phoneLabel || C.appName;
    $("phone-chips").innerHTML = (T.phoneChips||[]).map(x=>`<span>${x}</span>`).join("");
    $("hero-meta").innerHTML = (T.heroMeta||[]).map(m=>`<span><span class="chk">✓</span> ${m}</span>`).join("");

    // Botones enlaces
    $("hero-dl-text").textContent = T.dlBtn;
    $("dl-btn-text").textContent = T.dlBtn;
    $("hero-tg-text").textContent = T.tgBtn;
    $("hero-prem-text").textContent = T.premBtn;

    // About
    $("about-title").textContent = T.aboutTitle;
    $("about-text").textContent = T.aboutText;
    $("about-points").innerHTML = (T.aboutPoints||[]).map(p=>`<span><span class="chk">✓</span> ${p}</span>`).join("");

    // Highlight (biblioteca sin dueño)
    $("highlight-tag").textContent = T.highlightTag;
    $("highlight-title").textContent = T.highlightTitle;
    $("highlight-text").textContent = T.highlightText;
    $("highlight-points").innerHTML = (T.highlightPoints||[]).map(p=>`<span><span class="chk">✓</span> ${p}</span>`).join("");

    // Features
    $("features-title").textContent = T.featuresTitle;
    $("features-sub").textContent = T.featuresSub;
    $("features-grid").innerHTML = (T.features||[]).map(f=>`
      <div class="fcard">
        <div class="ic">${f.emoji}</div>
        <h3>${f.titulo}</h3>
        <p>${f.texto}</p>
      </div>`).join("");

    // Screenshots (usa campos ES/EN)
    $("shots-title").textContent = T.shotsTitle;
    $("shots-sub").textContent = T.shotsSub;
    $("shots-grid").innerHTML = (C.screenshots||[]).map(s=>`
      <div class="shot">
        <div class="frame"><img src="${s.img}" alt="${s.tituloES}" loading="lazy"></div>
        <div class="cap">${lang==="es"?s.tituloES:s.tituloEN}<small>${lang==="es"?s.notaES:s.notaEN}</small></div>
      </div>`).join("");

    // Descarga
    $("dl-title").textContent = T.dlTitle;
    $("dl-sub").textContent = T.dlSub;
    $("dl-notes").innerHTML = `<span>⬇ ${T.dlNote}</span><span>🤖 Android</span>`;

    // FAQ
    $("faq-title").textContent = T.faqTitle;
    $("faq-list").innerHTML = (T.faq||[]).map(f=>`
      <div class="qa"><h4>${f.q}</h4><p>${f.a}</p></div>`).join("");

    // Footer
    const crEl = document.querySelector('[data-i18n="foot_copyright"]');
    if (crEl) crEl.textContent = (T.footCopyright||"© {year} Lumen Reader").replace("{year}", new Date().getFullYear());
    $("foot-privacy").textContent = T.footPrivacy || "";
    $("year").textContent = new Date().getFullYear();
  }

  // ---------- Enlaces (independientes del idioma) ----------
  function applyLinks(){
    const dl = C.downloadUrl || "#";
    $("hero-dl").href = dl;
    $("dl-btn").href = dl;
    $("hero-tg").href = C.telegramUrl || "#";
    $("hero-prem").href = C.premiumUrl || "#";
  }

  // ---------- Iniciar ----------
  initTheme();
  $("lang-toggle").addEventListener("click", () => setLang(lang === "es" ? "en" : "es"));
  lang = detectLang();
  setLang(lang);
  applyLinks();
})();
</script>
